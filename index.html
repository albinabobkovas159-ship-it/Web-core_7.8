<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="sidebar">
      <header class="header">
        <div class="header__left">
          <button
            class="header__burger effect"
            type="button"
            aria-label="Close-menu"
          >
            <img src="./Image/burger.svg" alt="burger-button" />
          </button>
          <button class="header__logo" type="button" aria-label="logo">
            <img src="./Image/Group.svg" alt="Logo" />
          </button>
        </div>
        <div class="header__right">
          <button
            class="header__search effect"
            type="button"
            aria-label="Search"
          >
            <img src="./Image/search.svg" alt="Search" />
          </button>
        </div>
      </header>
      <main class="main">
        <nav class="main-nav">
          <a class="main-nav__link" href="index.html">Ремонт техники</a>
          <a class="main-nav__link" href="index.html">Услуги и сервисы</a>
          <a class="main-nav__link" href="index.html">Корпоративным клиентам</a>
          <a class="main-nav__link" href="index.html">Продавцам техники</a>
          <a class="main-nav__link" href="index.html">Партнёрам</a>
          <a class="main-nav__link" href="index.html">Производителям</a>
          <a class="main-nav__link" href="index.html">Наши сервисные центры</a>
          <a class="main-nav__link" href="index.html">Контакты</a>
        </nav>
      </main>
      <footer class="footer">
        <div class="footer__contact-buttons">
          <button class="footer__call effect" type="button" aria-label="call">
            <img src="./Image/chat copy.svg" alt="Call button" />
          </button>
          <button class="footer__chat effect" type="button" aria-label="chat">
            <img src="./Image/chat.svg" alt="Chat button" />
          </button>
          <button
            class="footer__profile effect"
            type="button"
            aria-label="profile"
          >
            <img src="./Image/profile.svg" alt="Profile button" />
          </button>
        </div>
        <div class="footer__contacts">
          <a class="footer__email" href="mailto:mail@cps.com">mail@cps.com</a>
          <a class="footer__phone" href="tel:88008908900">8 800 890 8900</a>
        </div>
        <div class="footer__language">
          <button
            class="footer__ru"
            type="button"
            aria-label="Russian language"
          >
            RU
          </button>
          <button
            class="footer__en"
            type="button"
            aria-label="English language"
          >
            EN
          </button>
          <button
            class="footer__ch"
            type="button"
            aria-label="Chinese language"
          >
            CH
          </button>
        </div>
      </footer>
    </div>
  </body>
</html>
